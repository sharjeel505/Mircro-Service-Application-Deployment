apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sharjeel505/Mircro-Service-Application-Deployment.git'
    targetRevision: dev
    path: argocd-workload/apps/api/helm-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: microservice-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
