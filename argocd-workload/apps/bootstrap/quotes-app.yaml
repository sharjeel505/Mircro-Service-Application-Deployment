apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sharjeel505/Mircro-Service-Application-Deployment.git'
    path: argocd-workload/apps/quotes/helm-chart
    targetRevision: dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: microservice-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
